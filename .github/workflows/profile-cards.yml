name: Generate profile summary cards

on:
  schedule:
    - cron: "0 0 * * *" # once a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate cards (stats, languages, productive time)
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Uses your personal token if you add one (counts private repos too),
          # otherwise falls back to the built-in token (public repos only).
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 5
